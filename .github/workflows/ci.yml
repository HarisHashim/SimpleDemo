name: Continuous Integration (CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-build-test:
    name: Backend Build & Test (Spring Boot + MySQL + Flyway)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_PASSWORD || 'root' }}
          MYSQL_DATABASE: simple_demo_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Run Migrations with Maven
        working-directory: ./backend
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME || 'root' }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'root' }}
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/simple_demo_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        run: |
          mvn clean verify

  frontend-build:
    name: Frontend Build (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies & Build
        working-directory: ./frontend
        run: |
          npm ci
          npm run build -- --configuration production

  docker-compose-check:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create local .env from template
        run: cp .env.example .env

      - name: Build Docker Compose Images
        run: docker compose build
